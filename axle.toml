[package]
name = "smalt"
version = "0.1.0"
kind = "lib"
# The targets this library promises to serve. The promise is what the
# port checks enforce: an incomplete port is an error only for a target
# named here.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# No `[link]` section, on either port. Every library is named by the block
# that imports from it — `extern "C" from "gdi32"` in `sys/win32/win32_gdi`,
# `from "X11"` in `sys/x11/x11_lib`, `from "asound"` in `sys/alsa/alsa_lib`
# — so a consumer links what it uses without being told twice, and links
# only what its own target compiles. `kernel32` / `user32` on Windows and
# `c` on Linux are default-linked; naming them in their blocks is
# documentation the linker ignores.

# The ports: one condition, and the directories that carry it.
#
# The names describe the *backend*, not the OS — `sys_clock` on Linux is
# POSIX and has nothing to do with X11, and a future Wayland port would
# also be `os = "linux"`. Nothing here is reserved by the compiler: a
# directory this table does not name is an ordinary directory.
[port.win32]
when = { os = "windows" }
dirs = ["win32"]

[port.x11]
when = { os = "linux" }
dirs = ["x11", "posix", "alsa"]

# A second Linux backend, chosen by a feature. `{ os = "linux", feature =
# "wayland" }` is narrower than `{ os = "linux" }`, so it wins when the
# feature is on and the X11 port answers when it is off — the invariant
# is one active port per target, never two that overlap.
[features]
wayland = false

[port.wayland]
when = { os = "linux", feature = "wayland" }
dirs = ["wayland", "posix", "alsa"]
