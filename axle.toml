[package]
name = "smalt"
version = "0.1.0"
kind = "lib"

# No `[link]` section. Win32 only, and every DLL is named by the block that
# imports from it — `extern "C" from "gdi32" { … }` in `sys/win32_gdi`,
# `"winmm"` in `sys/win32_mm`. The declaration that needs a library is the
# declaration that names it, so a consumer of this crate links what it uses
# without being told twice. `kernel32` / `user32` are default-linked by the
# compiler; naming them in their blocks is documentation the linker ignores.
