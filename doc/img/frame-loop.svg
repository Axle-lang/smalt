<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 372" width="980" height="372" role="img" aria-label="A frame: time, input, simulate, draw, present"><title>A frame: time, input, simulate, draw, present</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1230"/><stop offset="1" stop-color="#1a2a6c"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter></defs><rect width="980" height="372" rx="22" fill="url(#bg)"/><text x="490.0" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e8ecff" text-anchor="middle" opacity="1">A frame is five calls</text><rect x="36" y="84" width="170" height="150" rx="14" fill="#0f1b45" opacity="1" stroke="#4aa3ff" stroke-width="2"/><text x="121" y="114" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#4aa3ff" text-anchor="middle" opacity="1">1  time</text><text x="121" y="146" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="500" fill="#e8ecff" text-anchor="middle" opacity="1">pacer.tick(clock)</text><text x="121" y="184" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6d6" text-anchor="middle" opacity="1">dt, or fixed steps</text><text x="121" y="204" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6d6" text-anchor="middle" opacity="1">steps() · alpha()</text><line x1="208" y1="159" x2="222" y2="159" stroke="#9aa6d6" stroke-width="2" stroke-linecap="round"/><path d="M222,159 L213.9,162.9 L213.9,155.1 Z" fill="#9aa6d6"/><rect x="224" y="84" width="170" height="150" rx="14" fill="#0f1b45" opacity="1" stroke="#2fc4b2" stroke-width="2"/><text x="309" y="114" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2fc4b2" text-anchor="middle" opacity="1">2  input</text><text x="309" y="146" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="500" fill="#e8ecff" text-anchor="middle" opacity="1">events.pump(win, clock)</text><text x="309" y="184" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6d6" text-anchor="middle" opacity="1">drain the queue</text><text x="309" y="204" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6d6" text-anchor="middle" opacity="1">isKeyDown · mouseDX</text><line x1="396" y1="159" x2="410" y2="159" stroke="#9aa6d6" stroke-width="2" stroke-linecap="round"/><path d="M410,159 L401.9,162.9 L401.9,155.1 Z" fill="#9aa6d6"/><rect x="412" y="84" width="170" height="150" rx="14" fill="#0f1b45" opacity="1" stroke="#f2c14e" stroke-width="2"/><text x="497" y="114" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2c14e" text-anchor="middle" opacity="1">3  simulate</text><text x="497" y="146" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="500" fill="#e8ecff" text-anchor="middle" opacity="1">your game</text><text x="497" y="184" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6d6" text-anchor="middle" opacity="1">step by dt or by</text><text x="497" y="204" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6d6" text-anchor="middle" opacity="1">the fixed step</text><line x1="584" y1="159" x2="598" y2="159" stroke="#9aa6d6" stroke-width="2" stroke-linecap="round"/><path d="M598,159 L589.9,162.9 L589.9,155.1 Z" fill="#9aa6d6"/><rect x="600" y="84" width="170" height="150" rx="14" fill="#0f1b45" opacity="1" stroke="#ff7a45" stroke-width="2"/><text x="685" y="114" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ff7a45" text-anchor="middle" opacity="1">4  draw</text><text x="685" y="146" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="500" fill="#e8ecff" text-anchor="middle" opacity="1">device.drawMesh(…)</text><text x="685" y="184" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6d6" text-anchor="middle" opacity="1">SoftDevice or</text><text x="685" y="204" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6d6" text-anchor="middle" opacity="1">Renderer::render</text><line x1="772" y1="159" x2="786" y2="159" stroke="#9aa6d6" stroke-width="2" stroke-linecap="round"/><path d="M786,159 L777.9,162.9 L777.9,155.1 Z" fill="#9aa6d6"/><rect x="788" y="84" width="170" height="150" rx="14" fill="#0f1b45" opacity="1" stroke="#ef6f8e" stroke-width="2"/><text x="873" y="114" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ef6f8e" text-anchor="middle" opacity="1">5  present</text><text x="873" y="146" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="500" fill="#e8ecff" text-anchor="middle" opacity="1">device.endFrame(win)</text><text x="873" y="184" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6d6" text-anchor="middle" opacity="1">blit · swapchain</text><text x="873" y="204" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6d6" text-anchor="middle" opacity="1">· Wayland buffer</text><path d="M906,238 C906,290 74,290 74,244" fill="none" stroke="#9aa6d6" stroke-width="2" stroke-dasharray="6 6"/><line x1="74" y1="252" x2="74" y2="240" stroke="#9aa6d6" stroke-width="2" stroke-linecap="round"/><path d="M74,240 L77.9,248.1 L70.1,248.1 Z" fill="#9aa6d6"/><text x="490.0" y="328" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#9aa6d6" text-anchor="middle" opacity="1">repeat until Quit — a Quit is a request on a window that is still alive, so the game may prompt, save or refuse</text><text x="490.0" y="352" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#9aa6d6" text-anchor="middle" opacity="1">A tool that repaints on change swaps step 1 for Events::wait and sleeps in the OS instead of spinning a core.</text></svg>
